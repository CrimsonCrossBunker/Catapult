plugins { id 'com.android.application' }

// Same encrypted keystore/properties contract as the CCB game repository.
// The workflow decrypts into an ephemeral directory outside the checkout.
def signingDirectory = System.getenv('CCB_ANDROID_SIGNING_DIR')
def sharedSigning = new Properties()
if (signingDirectory) {
    new File(signingDirectory, 'keystore.properties').withReader('UTF-8') { reader ->
        sharedSigning.load(reader)
    }
    ['storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!sharedSigning.getProperty(name)) {
            throw new GradleException("Shared signing configuration is missing ${name}")
        }
    }
}
android {
    namespace 'org.crimsoncrossbunker.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'org.crimsoncrossbunker.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.3.0-ccb'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    signingConfigs {
        release {
            if (signingDirectory) {
                // Ignore the game repository's relative storeFile path.
                storeFile new File(signingDirectory, 'release.keystore')
                storePassword sharedSigning.getProperty('storePassword')
                keyAlias sharedSigning.getProperty('keyAlias')
                keyPassword sharedSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
