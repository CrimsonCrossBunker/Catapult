plugins { id 'com.android.application' }
android {
    namespace 'org.crimsoncrossbunker.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'org.crimsoncrossbunker.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.3.0-ccb'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    signingConfigs {
        release {
            if (System.getenv('CCB_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('CCB_ANDROID_KEYSTORE'))
                storePassword System.getenv('CCB_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('CCB_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('CCB_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
